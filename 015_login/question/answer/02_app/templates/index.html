{% extends "base.html" %}
{% block title %}トップ{% endblock %}
{% block content %}
<h1>トップページ</h1>
{% if current_user.is_authenticated %}
    <p>ログイン中：<strong>{{ current_user.username }}</strong></p>
    <p><a href="{{ url_for('mypage') }}">マイページへ</a></p>
{% else %}
    <p>ログインすることでマイページを閲覧できます。</p>
    <p>
        <a href="{{ url_for('login') }}">ログイン</a> /
        <a href="{{ url_for('register') }}">新規登録</a>
    </p>
{% endif %}
{% endblock %}
