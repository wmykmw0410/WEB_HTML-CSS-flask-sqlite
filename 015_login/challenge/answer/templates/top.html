{% extends "base.html" %}

{% block content %}
<h1>書籍一覧</h1>
<div class="card-grid">
    {% for book in books %}
    <a class="card" href="/books/{{ book.id }}">
        <img src="/static/img/{{ book.image }}" alt="{{ book.title }}">
        <h3>{{ book.title }}</h3>
        <p>{{ book.author }}</p>
        <p>¥{{ book.price }}</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
