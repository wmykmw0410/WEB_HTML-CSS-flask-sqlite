{% extends "base.html" %}

{% block title %}{{ title }} - ブックストア{% endblock %}

{% block content %}
<div class="detail">
    <img src="{{ image }}" alt="{{ title }}">
    <h1>{{ title }}</h1>
    <p>{{ author_line }}</p>
    <p>{{ price_line }}</p>
    {% if genre_line %}<p>{{ genre_line }}</p>{% endif %}
    <a class="back-link" href="/">一覧へ戻る</a>
</div>
{% endblock %}
