{% extends "base.html" %}

{% block content %}
<h1>メモ一覧</h1>
<div class="card-grid">
    {% for memo in memos %}
    <a class="card" href="/memos/{{ memo.id }}">
        <span class="tag">{{ memo.category }}</span>
        <h3>{{ memo.title }}</h3>
        <p>{{ memo.body }}</p>
    </a>
    {% endfor %}
</div>
{% endblock %}
