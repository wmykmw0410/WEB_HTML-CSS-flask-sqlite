{% extends "base.html" %}

{% block title %}書籍一覧{% endblock %}

{% block content %}
    <h1>書籍一覧</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>在庫</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.id }}</td>
                <td>{{ book.title }}</td>
                <td>{% if book.in_stock %}在庫あり{% else %}在庫なし{% endif %}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
