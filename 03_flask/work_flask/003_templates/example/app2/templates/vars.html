<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>変数展開</title>
</head>
<body>
    <h1>辞書型</h1>
    <p>{{ key.temp }} / {{ key['jinja'] }}</p>

    <h1>リスト型</h1>
    <ol>
        <li>{{ words.0 }}</li>
        <li>{{ words[1] }}</li>
        <li>{{ words[2] }}</li>
    </ol>

    <h1>クラス型</h1>
    <p>{{ user.name }} / {{ user.age }}</p>
</body>
</html>
