<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題2：送信前に入力をチェックする</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #262b33; }
        .field { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c8ced8; border-radius: 6px; font: inherit; }
        .invalid { border-color: #d14343; }
        .error { color: #d14343; font-size: 0.85rem; margin: 4px 0 0; min-height: 1.2em; }
        #result { background: #e9f7ee; padding: 8px; border-radius: 6px; }
        #result:empty { display: none; }
    </style>
</head>
<body>
    <h1>メモを作成</h1>
    <form id="memo-form" action="#" method="post" novalidate>
        <div class="field">
            <label for="title">タイトル</label>
            <input id="title" type="text" name="title">
            <p class="error" id="title-error"></p>
        </div>
        <div class="field">
            <label for="body">本文</label>
            <textarea id="body" name="body" rows="4"></textarea>
            <p class="error" id="body-error"></p>
        </div>
        <button type="submit">保存する</button>
        <button type="reset">クリア</button>
    </form>
    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
