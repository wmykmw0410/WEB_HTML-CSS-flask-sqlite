<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>解答1：動かないカウンターを直す</title>
    <!--
        解答1：3つのバグとその見つけ方

        バグ1（HTML）：<script> を <head> で読み込んでいた
          - 症状：Console に「TypeError: Cannot read properties of null (reading 'addEventListener')」
          - 原因：ブラウザはHTMLを上から順に読むため、<head> の時点ではまだ <textarea> が存在せず、
                  getElementById() が null を返していた
          - 修正：<script> を </body> の直前に移動する（または <script defer src="..."> にする）

        バグ2（JS）：getElementById('messsage') の綴り間違い（s が1つ多い）
          - 症状：バグ1を直しても、同じ TypeError が出続ける
          - 見つけ方：エラーの行番号をクリックすると該当行が表示される。
                      Console で document.getElementById('messsage') と打つと null、
                      document.getElementById('message') と打つと要素が返ることで確認できる
          - 修正：'message' にする

        バグ3（JS）：value.lenght の綴り間違い（正しくは length）
          - 症状：エラーは出ないのに、入力すると「undefined文字」と表示される
          - 原因：存在しないプロパティを読むとエラーではなく undefined になる
          - 見つけ方：Sources パネルで const length = ... の次の行にブレークポイントを置いて入力すると、
                      length の値が undefined になっていることがわかる
          - 修正：length にする

        教訓：エラーが出るバグ（1・2）は Console が場所を教えてくれる。
              エラーが出ないバグ（3）は、ブレークポイントや console.log で途中の値を確かめて探す
    -->
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        textarea { width: 100%; height: 100px; box-sizing: border-box; }
        #count.over { color: #d14343; font-weight: bold; }
    </style>
</head>
<body>
    <h1>文字数カウンター（20文字まで）</h1>
    <textarea id="message"></textarea>
    <p><span id="count">0</span>文字</p>

    <!-- バグ1の修正：</body> の直前で読み込む -->
    <script src="script.js"></script>
</body>
</html>
