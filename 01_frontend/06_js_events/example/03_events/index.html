<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3. いろいろなイベント</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
        .buttons button { margin-right: 8px; }
        .error { color: #d14343; font-size: 0.9em; margin: 4px 0 0; }
        .hover-area { display: flex; gap: 12px; flex-wrap: wrap; }
        .hover-area button { position: relative; padding: 8px 16px; }
        .tooltip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; background: #262b33; color: #fff; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; }
        .tooltip[hidden] { display: none; }
        .box { padding: 12px; border: 2px dashed #9aa5b8; border-radius: 8px; }
        .box span { display: inline-block; margin: 4px; padding: 6px 10px; background: #e8edfb; border-radius: 4px; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; }
    </style>
</head>
<body>
    <h1>イベント</h1>

    <section>
        <h2>1. イベントオブジェクト</h2>
        <div class="buttons" id="buttons">
            <button type="button" data-color="赤">赤</button>
            <button type="button" data-color="青">青</button>
            <button type="button" data-color="緑">緑</button>
        </div>
        <p class="output" id="click-output">ボタンを押してください</p>
        <input type="text" id="key-input" placeholder="ここでキーを押してみる">
        <p class="output" id="key-output"></p>
    </section>

    <section>
        <h2>2. フォームの送信を止める（submit + preventDefault）</h2>
        <form id="memo-form" action="#" method="post">
            <label for="title">タイトル</label>
            <input id="title" type="text" name="title">
            <p class="error" id="title-error"></p>
            <button type="submit">保存する</button>
        </form>
        <p class="output" id="form-output"></p>
    </section>

    <section>
        <h2>3. confirm() で確認する</h2>
        <p><a href="https://developer.mozilla.org/ja/" id="leave-link">MDNへ移動する</a></p>
        <form action="#" method="post">
            <!-- 削除ボタンでよく使う書き方 -->
            <button type="submit" onclick="return confirm('削除しますか？')">削除</button>
        </form>
    </section>

    <section>
        <h2>4. ホバー（マウスを乗せる）とフォーカス</h2>
        <p>ボタンにマウスを乗せる、または Tab キーでフォーカスを移すと、説明（ツールチップ）が出ます。</p>
        <div class="hover-area">
            <button type="button" data-tip="メモを新しく作ります">新規作成</button>
            <button type="button" data-tip="選んだメモを削除します">削除</button>
            <button type="button" data-tip="一覧を最新の状態にします">更新</button>
        </div>

        <h3>mouseover と mouseenter の違い</h3>
        <p>点線の箱の中で、子要素（青い四角）の上を行き来してみてください。</p>
        <div class="box" id="hover-box">
            <span>子要素1</span><span>子要素2</span><span>子要素3</span>
        </div>
        <p class="output" id="hover-count">mouseover：0回 ／ mouseenter：0回</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
