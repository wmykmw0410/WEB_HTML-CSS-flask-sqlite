<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答3：表を作る</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 24px;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #c8ced8;
            padding: 6px 12px;
        }

        thead th {
            background: #eef3ff;
        }

        td {
            text-align: right;
        }

        tbody tr:nth-child(even) {
            background: #f4f6f9;
        }
    </style>
</head>
<body>
    <h1>メモの集計</h1>

    <table>
        <caption>カテゴリ別メモ件数（10月）</caption>
        <thead>
            <tr>
                <th scope="col">カテゴリ</th>
                <th scope="col">第1週</th>
                <th scope="col">第2週</th>
                <th scope="col">合計</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">家事</th>
                <td>3</td>
                <td>2</td>
                <td>5</td>
            </tr>
            <tr>
                <th scope="row">仕事</th>
                <td>4</td>
                <td>6</td>
                <td>10</td>
            </tr>
            <tr>
                <th scope="row">趣味</th>
                <td colspan="2">集計中</td>
                <td>-</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">合計</th>
                <td colspan="2"></td>
                <td>15</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
