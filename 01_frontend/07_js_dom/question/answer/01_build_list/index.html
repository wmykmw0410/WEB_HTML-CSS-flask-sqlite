<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答1：JavaScriptで要素を作って書き換える</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .memo-list li { margin-bottom: 4px; }
        .tag { display: inline-block; font-size: 0.75em; background: #e8edfb; color: #3f6fd1; padding: 0 8px; border-radius: 999px; margin-right: 6px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>JavaScriptで要素を作る</h1>

    <section>
        <h2>1. メモの一覧</h2>
        <ul class="memo-list" id="memo-list"></ul>
    </section>

    <section>
        <h2>2. リンク</h2>
        <p><a class="doc-link" href="https://developer.mozilla.org/ja/" data-lang="ja">MDN（日本語）</a></p>
        <p class="output" id="lang-output"></p>
    </section>

    <section>
        <h2>3. ユーザーが入力した文字</h2>
        <p class="output" id="user-output"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
