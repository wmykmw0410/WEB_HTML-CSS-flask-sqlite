<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3. いろいろなイベント</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        button { padding: 8px 16px; border: 1px solid #3f6fd1; border-radius: 6px; background: #fff; color: #3f6fd1; cursor: pointer; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
        .tip { background: #262b33; color: #fff; font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .tip:empty { display: none; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; }
    </style>
</head>
<body>
    <h1>いろいろなイベント</h1>

    <section>
        <h2>1. イベントオブジェクト</h2>
        <button type="button" id="event-button">クリックしてみる</button>
        <p class="output" id="click-output">ボタンを押してください</p>

        <input type="text" id="key-input" placeholder="ここでキーを押してみる">
        <p class="output" id="key-output"></p>
    </section>

    <section>
        <h2>2. ホバー（マウスを乗せる）とフォーカス</h2>
        <p>ボタンにマウスを乗せる、または Tab キーでフォーカスを移すと、説明が出ます。</p>
        <button type="button" id="tip-button">新規作成</button>
        <p class="tip" id="tip"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
