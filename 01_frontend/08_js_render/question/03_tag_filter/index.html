<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題3：タグとキーワードで絞り込む</title>
    <style>
        body { font-family: sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; color: #262b33; }
        .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .filters button { padding: 6px 14px; border: 1px solid #c8ced8; border-radius: 999px; background: #fff; cursor: pointer; font: inherit; }
        .filters button[aria-pressed="true"] { background: #3f6fd1; color: #fff; border-color: #3f6fd1; }
        input[type="search"] { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
        .count { color: #6b7280; font-size: 0.9rem; }
        .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 0; list-style: none; }
        .work { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px; }
        .work h3 { margin: 0 0 6px; font-size: 1rem; }
        .work .tags { font-size: 0.75rem; color: #3f6fd1; }
    </style>
</head>
<body>
    <h1>制作実績</h1>

    <div class="filters">
        <button type="button" data-tag="all" aria-pressed="true">すべて</button>
        <button type="button" data-tag="HTML" aria-pressed="false">HTML</button>
        <button type="button" data-tag="CSS" aria-pressed="false">CSS</button>
        <button type="button" data-tag="JavaScript" aria-pressed="false">JavaScript</button>
        <button type="button" data-tag="Python" aria-pressed="false">Python</button>
    </div>

    <input type="search" id="keyword" placeholder="タイトルで検索" aria-label="タイトルで検索">
    <p class="count" id="count">6件表示中</p>
    <p id="empty" hidden>該当する作品はありません</p>

    <ul class="works">
        <li class="work" data-tags="HTML CSS"><h3>自己紹介ページ</h3><p class="tags">HTML / CSS</p></li>
        <li class="work" data-tags="HTML CSS JavaScript Python"><h3>メモ帳アプリ</h3><p class="tags">HTML / CSS / JavaScript / Python</p></li>
        <li class="work" data-tags="HTML CSS"><h3>カフェのLP</h3><p class="tags">HTML / CSS</p></li>
        <li class="work" data-tags="JavaScript"><h3>タイピングアプリ</h3><p class="tags">JavaScript</p></li>
        <li class="work" data-tags="Python"><h3>蔵書管理ツール</h3><p class="tags">Python</p></li>
        <li class="work" data-tags="HTML JavaScript"><h3>天気ウィジェット</h3><p class="tags">HTML / JavaScript</p></li>
    </ul>

    <script src="script.js"></script>
</body>
</html>
