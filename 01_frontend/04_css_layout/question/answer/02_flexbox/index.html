<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答2：Flexboxでレイアウト</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: sans-serif;
            margin: 0;
            color: #262b33;
            background: #f4f6f9;
        }

        a { color: inherit; text-decoration: none; }

        /* ===== (1) ヘッダー ===== */
        .site-header {
            background: #3f6fd1;
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .login {
            border: 1px solid #ffffff;
            border-radius: 999px;
            padding: 4px 14px;
            margin-left: auto;   /* 左側の余白を最大まで取る → 右端へ */
        }

        /* ===== (2) プロフィールカード ===== */
        .stage {
            height: 320px;
            display: flex;
            justify-content: center;   /* 主軸（横）方向の中央 */
            align-items: center;       /* 交差軸（縦）方向の中央 */
        }

        .profile {
            width: 300px;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-top img {
            border-radius: 50%;
        }

        .profile-top p {
            margin: 4px 0 0;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }

        .actions button {
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: #3f6fd1;
            color: #ffffff;
            cursor: pointer;
            flex: 1;   /* 2つのボタンが同じ割合で余白を分け合う → 同じ幅になる */
        }

        /* ===== (3) フッター ===== */
        .site-footer {
            background: #262b33;
            color: #e6e8ec;
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
        }

        .site-footer section {
            /* flex: 伸びる比率 縮む比率 基本の幅 */
            flex: 1 1 180px;
        }

        .site-footer h2 {
            font-size: 1rem;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <strong>メモ帳</strong>
        <a href="#">一覧</a>
        <a href="#">新規作成</a>
        <a href="#" class="login">ログイン</a>
    </header>

    <div class="stage">
        <div class="profile">
            <div class="profile-top">
                <img src="img/sample.png" alt="山田太郎のアイコン" width="64" height="64">
                <div>
                    <strong>山田 太郎</strong>
                    <p>メモ 42件</p>
                </div>
            </div>
            <div class="actions">
                <button type="button">フォロー</button>
                <button type="button">メッセージ</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <section>
            <h2>メモ帳について</h2>
            <p>シンプルなメモアプリです。</p>
        </section>
        <section>
            <h2>サポート</h2>
            <p>よくある質問・お問い合わせ</p>
        </section>
        <section>
            <h2>SNS</h2>
            <p>最新情報を発信中</p>
        </section>
    </footer>
</body>
</html>
