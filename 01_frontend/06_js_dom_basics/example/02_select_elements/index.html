<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2. 要素を取得する方法</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
        .price { color: #3f6fd1; font-weight: bold; }
    </style>
</head>
<body>
    <h1>要素を取得する方法</h1>

    <section>
        <h2 id="heading">1. 1つの要素を取得する</h2>
        <p class="note">取得して、書き換えます。</p>
        <p class="output" id="single-output"></p>
    </section>

    <section>
        <h2>2. 複数の要素を取得する</h2>
        <ul id="fruit-list">
            <li class="item"><span class="name">りんご</span> <span class="price">120</span></li>
            <li class="item"><span class="name">バナナ</span> <span class="price">80</span></li>
            <li class="item"><span class="name">みかん</span> <span class="price">150</span></li>
        </ul>
        <p class="output" id="multi-output"></p>
    </section>

    <section>
        <h2>3. 見つからないとき</h2>
        <p>結果はConsoleで確認してください。</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
