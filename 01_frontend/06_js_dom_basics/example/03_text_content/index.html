<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3. textContentを使いこなす</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
        .price { color: #3f6fd1; font-weight: bold; }
    </style>
</head>
<body>
    <h1>textContentを使いこなす</h1>

    <section>
        <h2>1. 読み取る</h2>
        <p>単価：<span id="unit-price">1000</span>円</p>
        <p class="output" id="read-output"></p>
    </section>

    <section>
        <h2>2. 追記する・消す</h2>
        <p class="output" id="log-output"></p>
    </section>

    <section>
        <h2>3. タグを入れても、文字として表示される</h2>
        <p class="output" id="tag-output"></p>
    </section>

    <section>
        <h2>4. 子要素ごと置き換わる</h2>
        <div class="output" id="box"><span>子要素1</span> <span>子要素2</span></div>
        <p>↑ 2つの <code>&lt;span&gt;</code> が、1つの文字に置き換わります。</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
