<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1. ページの文字を書き換える</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1 id="page-title">ページの文字を書き換える</h1>

    <section>
        <h2>1. 取得して、書き換える</h2>
        <p class="output" id="message">まだ書き換わっていません</p>
    </section>

    <section>
        <h2>2. 変数の値を表示する</h2>
        <p class="output" id="total-output"></p>
    </section>

    <section>
        <h2>3. Consoleから書き換えてみる</h2>
        <p>開発者ツールのConsoleに、次の1行を貼り付けてEnterを押します。</p>
        <p><code>document.getElementById('console-target').textContent = 'Consoleから書き換えました'</code></p>
        <p class="output" id="console-target">ここが書き換わります</p>
    </section>

    <!-- </body> の直前に書く（05_js_basicsの0節） -->
    <script src="script.js"></script>
</body>
</html>
