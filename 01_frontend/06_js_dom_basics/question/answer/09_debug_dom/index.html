<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答9：書き換わらないページを直す</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 32px auto; padding: 0 16px; color: #262b33; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1 id="title">デバッグ：書き換わらない</h1>
    <p>2つの段落が、JavaScriptで書き換わっていることを確認してください。</p>
    <p class="output" id="message">まだ書き換わっていません</p>
    <p class="output" id="total">合計：</p>

    <!-- バグ1：<script> を <head> に書いていたので、<body> の要素が存在する前に実行されていた。</body> の直前に移した -->
    <script src="script.js"></script>
</body>
</html>
