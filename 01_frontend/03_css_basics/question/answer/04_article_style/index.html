<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答4：記事ページの装飾</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            /* TODO 1：左から順に探し、最初に見つかったフォントが使われる。最後は総称ファミリーで終える */
            font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
            /* TODO 2：line-height は単位なしで書く（子要素の文字サイズが変わっても 1.8 倍が保たれる） */
            font-size: 1rem;
            line-height: 1.8;
            color: #262b33;
            background: #f4f6f9;
        }

        /* ===== ヒーロー ===== */
        .hero {
            padding: 48px 16px;
            /* TODO 3 */
            background: linear-gradient(135deg, #3f6fd1, #7a5af8);
            /* TODO 4 */
            color: #ffffff;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            /* TODO 5 */
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .hero time {
            /* TODO 6 */
            letter-spacing: 0.15em;
        }

        /* ===== 記事 ===== */
        .article {
            max-width: 640px;
            margin: -24px auto 40px;   /* 上だけマイナスにして、ヒーローに少し重ねる */
            padding: 24px;
            background: #ffffff;
            /* TODO 7 */
            border-radius: 12px;
            /* TODO 8：横のずれ 縦のずれ ぼかし 色 */
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
        }

        .tag {
            display: inline-block;
            padding: 2px 12px;
            font-size: 0.8rem;
            background: #e8edfb;
            color: #3f6fd1;
            /* TODO 9：高さより十分大きな値にすると、両端が半円になる */
            border-radius: 999px;
        }

        .point {
            padding: 12px 16px;
            /* TODO 10：border-left で左の辺だけに線を引く */
            border-left: 4px solid #3f6fd1;
            background: #eef3ff;
        }

        .article a {
            color: #3f6fd1;
            /* TODO 11 */
            text-decoration: underline dotted;
        }

        .related {
            /* TODO 12：折り返さない・はみ出しを隠す・隠した部分を「…」にする */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>CSSで読みやすい文章を作る</h1>
        <time datetime="2026-10-03">2026年10月3日</time>
    </header>

    <article class="article">
        <p><span class="tag">#HTML</span> <span class="tag">#CSS</span></p>

        <p>
            文章の読みやすさは、内容だけでなく見た目にも大きく左右されます。
            文字の大きさ・行の高さ・字間・色の組み合わせを少し変えるだけで、
            同じ文章でも驚くほど読みやすくなります。
        </p>

        <p class="point">
            ポイント：日本語の本文の行の高さは 1.5〜1.8 くらいが目安です。
            行の高さは単位なしの数値で書くと、文字サイズが変わっても比率が保たれます。
        </p>

        <p>
            詳しくは <a href="https://developer.mozilla.org/ja/docs/Web/CSS/line-height">MDN の line-height のページ</a> を参照してください。
        </p>

        <p class="related">関連記事：フォントの選び方と、日本語のWebページでよく使われるフォントスタックの書き方について詳しく解説します</p>
    </article>
</body>
</html>
