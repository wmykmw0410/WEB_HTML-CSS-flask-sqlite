<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答2：基本のセレクタを書く</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 640px;
            margin: 24px auto;
            padding: 0 16px;
        }

        /* (1) 要素セレクタ：タグ名だけで、そのタグすべてに当たる */
        p {
            line-height: 1.8;
        }

        /* (2) グループ化：カンマで区切ると、どちらにも同じスタイルが当たる */
        h1, h2 {
            color: #3f6fd1;
        }

        /* (3) 子孫セレクタ：スペースで区切ると「article の中の h3」 */
        article h3 {
            color: #6b7280;
        }

        /* (4) 要素セレクタ */
        small {
            font-size: 0.85rem;
        }

        /* (5) 子孫セレクタ：a だけにすると、MDNへのリンクまで当たってしまう */
        nav a {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            background: #e8edfb;
            text-decoration: none;
        }

        /* (6) 疑似クラス :hover：マウスが乗っているとき。(5)と同じ範囲に限るため nav a に付ける */
        nav a:hover {
            background: #3f6fd1;
            color: #ffffff;
        }

    </style>
</head>
<body>
    <h1>メモ一覧</h1>
    <p>今週のメモをまとめています。</p>

    <h2>仕事</h2>
    <article>
        <h3>資料を作る</h3>
        <p>金曜日までに下書きを作り、先輩に見てもらう。</p>
        <small>2026年10月1日</small>
    </article>
    <article>
        <h3>会議の準備</h3>
        <p>議題を3つにまとめておく。</p>
        <small>2026年10月2日</small>
    </article>

    <h2>リンク</h2>
    <nav>
        <a href="#">メモ一覧</a>
        <a href="#">メモを追加</a>
        <a href="#">設定</a>
    </nav>
    <p>CSSの書き方は、<a href="https://developer.mozilla.org/ja/">MDN Web Docs</a>で調べられます。</p>
</body>
</html>
