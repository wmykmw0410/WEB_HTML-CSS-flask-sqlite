<body>
    <header class="hero">
        <h1>CSSで読みやすい文章を作る</h1>
        <time datetime="2026-10-03">2026年10月3日</time>
    </header>

    <article class="article">
        <p><span class="tag">#HTML</span> <span class="tag">#CSS</span></p>

        <p>
            文章の読みやすさは、内容だけでなく見た目にも大きく左右されます。
            文字の大きさ・行の高さ・字間・色の組み合わせを少し変えるだけで、
            同じ文章でも驚くほど読みやすくなります。
        </p>

        <p class="point">
            ポイント：日本語の本文の行の高さは 1.5〜1.8 くらいが目安です。
            行の高さは単位なしの数値で書くと、文字サイズが変わっても比率が保たれます。
        </p>

        <p>
            詳しくは <a href="https://developer.mozilla.org/ja/docs/Web/CSS/line-height">MDN の line-height のページ</a> を参照してください。
        </p>

        <p class="related">関連記事：フォントの選び方と、日本語のWebページでよく使われるフォントスタックの書き方について詳しく解説します</p>
    </article>
