<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSSの書き方</title>

    <!-- 書き方①：外部ファイルを読み込む（実務の基本。複数ページで同じCSSを使い回せる） -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 書き方②：<style>タグに書く（そのページ専用のCSS） -->
    <style>
        /*
            ルールの構造
            セレクタ {
                プロパティ: 値;
            }
        */
        h3 {
            color: #d1723f;
        }
    </style>
</head>
<body>
    <h1>CSSの書き方</h1>

    <h2>① 外部ファイル（css/style.css）で青色にしている見出し</h2>
    <h3>② styleタグで橙色にしている見出し</h3>
    <!-- 書き方③：style属性（インラインスタイル）。使い回せず優先度も強すぎるので、基本は使わない -->
    <p style="color: #2f9e44;">③ style属性で緑色にしている段落</p>
</body>
</html>
