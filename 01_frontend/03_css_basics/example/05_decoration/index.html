<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>背景・装飾</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            /*
                フォントは候補を左から順に並べる（フォントスタック）。
                最初に見つかったものが使われ、最後は総称ファミリー（sans-serif / serif）で終える
            */
            font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
            font-size: 1rem;
            line-height: 1.7;          /* 行の高さ。単位なしの数値で書くのが定石（文字サイズの1.7倍） */
            color: #262b33;
            background: #f4f6f9;
            margin: 0;
            padding: 24px;
        }

        .sample {
            background: #ffffff;
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            max-width: 640px;
        }

        /* ===== 背景 ===== */
        .bg-color    { background: #e8edfb; }
        .bg-gradient { background: linear-gradient(135deg, #3f6fd1, #7a5af8); color: #ffffff; }

        /* ===== 角丸・影 ===== */
        .radius-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .radius-row div {
            width: 120px;
            height: 80px;
            background: #3f6fd1;
            color: #ffffff;
            display: grid;
            place-items: center;     /* 中身を上下左右中央に（Gridの便利な書き方） */
            font-size: 0.8rem;
        }

        .r-small  { border-radius: 6px; }
        .r-pill   { border-radius: 999px; }   /* 大きな値を指定すると両端が丸い「ピル型」になる */
        /* 正円にするには幅と高さを揃える（.radius-row div より詳細度を上げて width を上書き） */
        .radius-row .r-circle { border-radius: 50%; width: 80px; }

        .shadow-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            padding: 8px;
        }

        .shadow-row div {
            width: 150px;
            padding: 16px;
            background: #ffffff;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        /* box-shadow: 横のずれ 縦のずれ ぼかし 色 */
        .s-soft   { box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
        .s-medium { box-shadow: 0 4px 12px rgb(0 0 0 / 0.15); }
        .s-strong { box-shadow: 0 12px 24px rgb(0 0 0 / 0.2); }

    </style>
</head>
<body>
    <h1>背景・装飾</h1>

    <div class="sample bg-color">
        <h2>背景色</h2>
        <p>background: #e8edfb</p>
    </div>

    <div class="sample bg-gradient">
        <h2>グラデーション</h2>
        <p>background: linear-gradient(135deg, #3f6fd1, #7a5af8)</p>
    </div>

    <div class="sample">
        <h2>角丸（border-radius）</h2>
        <div class="radius-row">
            <div class="r-small">6px</div>
            <div class="r-pill">999px（ピル型）</div>
            <div class="r-circle">50%</div>
        </div>
    </div>

    <div class="sample">
        <h2>影（box-shadow）</h2>
        <div class="shadow-row">
            <div class="s-soft">弱い影</div>
            <div class="s-medium">中くらいの影</div>
            <div class="s-strong">強い影</div>
        </div>
    </div>
</body>
</html>
