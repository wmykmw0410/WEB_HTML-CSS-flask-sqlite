<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>classとid</title>
    <style>
        /* ===== class と id ===== */

        /* 要素セレクタ：すべての <h2> */
        h2 {
            border-bottom: 2px solid #e1e5eb;
            padding-bottom: 4px;
        }

        /* クラスセレクタ：class="highlight" を持つ要素（何度でも使える） */
        .highlight {
            background: #fff3cd;
        }

        /* IDセレクタ：id="title" を持つ要素（ページ内で1つだけ） */
        #title {
            color: #3f6fd1;
        }

        /* 複数クラス：class="note warning" のように両方を持つ要素だけ（間にスペースを入れない） */
        .note.warning {
            border-left: 4px solid #d1723f;
            padding-left: 8px;
        }

        /* グループ化：カンマ区切りで複数のセレクタに同じスタイル */
        .note,
        .tip {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1 id="title">classとid</h1>

    <h2>class と id</h2>
    <p class="highlight">.highlight クラスの段落</p>
    <p class="note">.note だけの段落</p>
    <p class="note warning">.note と .warning の両方を持つ段落（.note.warning）</p>
    <p class="tip">.tip の段落（グループ化で .note と同じ文字サイズ）</p>
</body>
</html>
