<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題4：読書記録アプリ</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 16px; }
        input[type="text"] { padding: 8px; font: inherit; min-width: 0; }
        button { font: inherit; cursor: pointer; }
        .filters { display: flex; gap: 8px; }
        .filters button { padding: 4px 14px; border: 1px solid #c8ced8; border-radius: 999px; background: #fff; }
        .filters button[aria-pressed="true"] { background: #3f6fd1; color: #fff; border-color: #3f6fd1; }
        .summary { color: #6b7280; font-size: 0.9rem; }
        ul { padding: 0; list-style: none; }
        li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e1e5eb; padding: 8px 0; }
        li .info { flex: 1; }
        li .author { color: #6b7280; font-size: 0.85rem; }
        li.read .title { text-decoration: line-through; color: #9aa5b8; }
    </style>
</head>
<body>
    <h1>読書記録</h1>

    <form id="add-form">
        <input type="text" id="new-title" placeholder="タイトル" aria-label="タイトル">
        <input type="text" id="new-author" placeholder="著者" aria-label="著者">
        <button type="submit">追加</button>
    </form>

    <div class="filters">
        <button type="button" data-filter="all" aria-pressed="true">すべて</button>
        <button type="button" data-filter="unread" aria-pressed="false">未読</button>
        <button type="button" data-filter="read" aria-pressed="false">読了</button>
    </div>

    <p class="summary" id="summary"></p>
    <ul id="book-list"></ul>

    <script src="script.js"></script>
</body>
</html>
