<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答2：本の一覧を読み込む</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #c8ced8; padding: 6px 12px; text-align: left; }
        thead th { background: #eef3ff; }
        .status { color: #6b7280; }
        .status.error { color: #d14343; font-weight: bold; }
    </style>
</head>
<body>
    <h1>本棚</h1>
    <p class="status" id="status">読み込み中…</p>
    <table>
        <thead>
            <tr>
                <th scope="col">タイトル</th>
                <th scope="col">著者</th>
                <th scope="col">発表年</th>
                <th scope="col">読了</th>
            </tr>
        </thead>
        <tbody id="book-rows"></tbody>
    </table>
    <p id="summary"></p>

    <script src="script.js"></script>
</body>
</html>
