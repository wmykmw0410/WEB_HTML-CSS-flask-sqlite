<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>4. データから画面を作る</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        form { display: flex; gap: 8px; margin-bottom: 16px; }
        input[type="text"] { flex: 1; padding: 8px; }
        ul { padding: 0; list-style: none; }
        li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e1e5eb; padding: 8px 0; }
        li.done span { text-decoration: line-through; color: #9aa5b8; }
        li span { flex: 1; }
        .summary { color: #6b7280; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>やることリスト</h1>
    <p>追加・完了・削除してからリロードしても、状態が残ります。</p>

    <form id="add-form">
        <input type="text" id="new-title" placeholder="やること" required>
        <button type="submit">追加</button>
    </form>

    <p class="summary" id="summary"></p>
    <ul id="todo-list"></ul>

    <script src="script.js"></script>
</body>
</html>
