<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題1：1ページに2つのタブ</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        .tabs { margin-bottom: 40px; }
        .tab-list { display: flex; border-bottom: 2px solid #e1e5eb; }
        .tab-list button {
            padding: 10px 18px; border: none; background: none; font: inherit; color: #6b7280; cursor: pointer;
            border-bottom: 3px solid transparent; margin-bottom: -2px;
        }
        .tab-list button:hover { color: #262b33; }
        .tab-list button[aria-selected="true"] { color: #3f6fd1; font-weight: bold; border-bottom-color: #3f6fd1; }
        .tab-panel { padding: 16px 4px; }
    </style>
</head>
<body>
    <h1>1ページに2つのタブ</h1>

    <h2>プロフィール</h2>
    <div class="tabs">
        <div class="tab-list" role="tablist" aria-label="プロフィール">
            <button type="button" role="tab" id="tab-skills" aria-controls="panel-skills" aria-selected="true">スキル</button>
            <button type="button" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1">経歴</button>
            <button type="button" role="tab" id="tab-hobby" aria-controls="panel-hobby" aria-selected="false" tabindex="-1">趣味</button>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-skills" aria-labelledby="tab-skills">
            <p>HTML / CSS / JavaScript</p>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-history" aria-labelledby="tab-history" hidden>
            <p>2026年3月：学習を始める ／ 2026年8月：ポートフォリオを公開</p>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-hobby" aria-labelledby="tab-hobby" hidden>
            <p>読書・散歩・カフェめぐり</p>
        </div>
    </div>

    <h2>メモ</h2>
    <div class="tabs">
        <div class="tab-list" role="tablist" aria-label="メモのカテゴリ">
            <button type="button" role="tab" id="tab-all" aria-controls="panel-all" aria-selected="true">すべて</button>
            <button type="button" role="tab" id="tab-work" aria-controls="panel-work" aria-selected="false" tabindex="-1">仕事</button>
            <button type="button" role="tab" id="tab-home" aria-controls="panel-home" aria-selected="false" tabindex="-1">家事</button>
            <button type="button" role="tab" id="tab-fun" aria-controls="panel-fun" aria-selected="false" tabindex="-1">趣味</button>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-all" aria-labelledby="tab-all">
            <p>企画会議メモ・買い物リスト・読書メモ</p>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-work" aria-labelledby="tab-work" hidden>
            <p>企画会議メモ</p>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-home" aria-labelledby="tab-home" hidden>
            <p>買い物リスト</p>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-fun" aria-labelledby="tab-fun" hidden>
            <p>読書メモ</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
