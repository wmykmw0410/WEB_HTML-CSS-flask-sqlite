<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題3：作品ギャラリー</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; padding: 0; list-style: none; }
        .thumb { width: 100%; aspect-ratio: 1; border: none; border-radius: 8px; color: #fff; font: inherit; font-size: 0.85rem; cursor: pointer; transition: transform 0.15s; }
        .thumb:hover, .thumb:focus-visible { transform: scale(1.05); }
        dialog { width: min(90vw, 420px); border: none; border-radius: 12px; padding: 0; }
        dialog::backdrop { background: rgb(0 0 0 / 0.6); }
        .viewer { height: 220px; display: grid; place-items: center; color: #fff; font-size: 1.4rem; font-weight: bold; }
        .controls { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
        .controls button { padding: 6px 14px; font: inherit; cursor: pointer; }
        .counter { color: #6b7280; }
    </style>
</head>
<body>
    <h1>作品ギャラリー</h1>
    <ul class="gallery" id="gallery">
        <li><button type="button" class="thumb" data-title="メモ帳アプリ" data-color="#3f6fd1" style="background:#3f6fd1">メモ帳アプリ</button></li>
        <li><button type="button" class="thumb" data-title="ポートフォリオ" data-color="#2f9e44" style="background:#2f9e44">ポートフォリオ</button></li>
        <li><button type="button" class="thumb" data-title="カフェLP" data-color="#d1723f" style="background:#d1723f">カフェLP</button></li>
        <li><button type="button" class="thumb" data-title="タイピング" data-color="#7a5af8" style="background:#7a5af8">タイピング</button></li>
        <li><button type="button" class="thumb" data-title="蔵書管理" data-color="#c94040" style="background:#c94040">蔵書管理</button></li>
    </ul>

    <dialog id="viewer-dialog" aria-label="作品の拡大表示">
        <div class="viewer" id="viewer"></div>
        <div class="controls">
            <button type="button" id="prev" aria-label="前の作品">‹</button>
            <span class="counter" id="counter"></span>
            <button type="button" id="next" aria-label="次の作品">›</button>
            <button type="button" id="close">閉じる</button>
        </div>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
