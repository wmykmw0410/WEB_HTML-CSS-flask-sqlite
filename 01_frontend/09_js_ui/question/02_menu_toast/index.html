<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>問題2：メニューと通知のポップアップ</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        .cards { display: grid; gap: 12px; }
        .card { display: flex; align-items: center; justify-content: space-between; border: 1px solid #e1e5eb; border-radius: 8px; padding: 8px 16px; }
        .card h2 { font-size: 1rem; margin: 0; }
        .more { width: 36px; height: 36px; border: none; border-radius: 50%; background: #f4f6f9; font: inherit; cursor: pointer; }
        .more[aria-expanded="true"] { background: #e8edfb; }

        .menu-popup {
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            padding: 6px 0;
            min-width: 160px;
            box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
        }
        .menu-popup button { display: block; width: 100%; padding: 8px 16px; border: none; background: none; font: inherit; text-align: left; cursor: pointer; }
        .menu-popup button:hover { background: #f4f6f9; }
        .menu-popup [data-action="delete"] { color: #d14343; }

        .toast {
            inset: auto 16px 16px auto;   /* 右下に置く */
            margin: 0;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #262b33;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>メモ一覧</h1>

    <div class="cards">
        <article class="card">
            <h2>買い物リスト</h2>
            <!-- TODO 1 -->
            <button type="button" class="more" aria-label="買い物リストのメニュー" aria-expanded="false">⋯</button>
            <!-- TODO 1 -->
            <div id="menu-1" class="menu-popup">
                <button type="button" data-action="copy">コピー</button>
                <button type="button" data-action="delete">削除</button>
            </div>
        </article>

        <article class="card">
            <h2>企画会議メモ</h2>
            <!-- TODO 1 -->
            <button type="button" class="more" aria-label="企画会議メモのメニュー" aria-expanded="false">⋯</button>
            <!-- TODO 1 -->
            <div id="menu-2" class="menu-popup">
                <button type="button" data-action="copy">コピー</button>
                <button type="button" data-action="delete">削除</button>
            </div>
        </article>
    </div>

    <!-- TODO 2 -->
    <div id="toast" class="toast" role="status"></div>

    <script src="script.js"></script>
</body>
</html>
