<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1. タブ切り替え</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }

        /* タブのボタンを横に並べる */
        .tab-list {
            display: flex;
            border-bottom: 2px solid #e1e5eb;
        }

        .tab-list button {
            padding: 10px 18px;
            border: none;
            background: none;
            font: inherit;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;   /* 下線を .tab-list の線に重ねる */
        }

        .tab-list button:hover {
            color: #262b33;
        }

        /* 選択中のタブ：aria-selected="true" を属性セレクタで選んで見た目を変える */
        .tab-list button[aria-selected="true"] {
            color: #3f6fd1;
            font-weight: bold;
            border-bottom-color: #3f6fd1;
        }

        .tab-panel {
            padding: 16px 4px;
        }
    </style>
</head>
<body>
    <h1>タブ切り替え</h1>
    <p>タブをクリックすると、下の内容が切り替わります。タブにフォーカスがある状態で ← → キーでも切り替えられます。</p>

    <div class="tabs" id="profile-tabs">
        <!-- role="tablist" / "tab" / "tabpanel"：読み上げソフトに「これはタブだ」と伝える -->
        <div class="tab-list" role="tablist" aria-label="プロフィール">
            <button type="button" role="tab" id="tab-skills" aria-controls="panel-skills" aria-selected="true">スキル</button>
            <button type="button" role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1">経歴</button>
            <button type="button" role="tab" id="tab-hobby" aria-controls="panel-hobby" aria-selected="false" tabindex="-1">趣味</button>
        </div>

        <!-- 選ばれていないパネルには hidden 属性を付けて隠す -->
        <div class="tab-panel" role="tabpanel" id="panel-skills" aria-labelledby="tab-skills">
            <ul>
                <li>HTML / CSS：ひとりでページを作れる</li>
                <li>JavaScript：DOM操作・イベント処理ができる</li>
            </ul>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-history" aria-labelledby="tab-history" hidden>
            <ol>
                <li>2026年3月：学習を始める</li>
                <li>2026年8月：ポートフォリオサイトを公開</li>
            </ol>
        </div>
        <div class="tab-panel" role="tabpanel" id="panel-hobby" aria-labelledby="tab-hobby" hidden>
            <p>読書・散歩・カフェめぐり</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
