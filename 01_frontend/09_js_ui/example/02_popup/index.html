<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2. ポップアップ</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        button { padding: 8px 16px; font: inherit; cursor: pointer; }

        /* popover 属性を付けた要素は、ブラウザが「最前面」に表示する。位置や見た目は自分で決める */
        .menu-popup {
            border: 1px solid #e1e5eb;
            border-radius: 8px;
            padding: 8px 0;
            box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
            min-width: 180px;
        }

        .menu-popup ul { margin: 0; padding: 0; list-style: none; }
        .menu-popup a { display: block; padding: 8px 16px; color: #262b33; text-decoration: none; }
        .menu-popup a:hover { background: #f4f6f9; }

        .help-popup {
            max-width: 280px;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            background: #262b33;
            color: #ffffff;
            box-shadow: 0 8px 24px rgb(0 0 0 / 0.2);
        }

        /* 通知（トースト）：画面の右下に出す */
        .toast {
            inset: auto 16px 16px auto;   /* top right bottom left の順。右下に置く */
            margin: 0;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #2f9e44;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>ポップアップ</h1>
    <p>ポップアップは、後ろの画面を操作したまま出せる小さな窓です。外側をクリックするか Esc キーで閉じます。</p>

    <section>
        <h2>1. HTMLだけで開く（popover 属性）</h2>
        <!--
            popovertarget="ポップアップのid" を付けたボタンを押すと、そのポップアップが開閉する
            JavaScript を1行も書かなくても、開閉・外側クリックで閉じる・Esc で閉じる、がすべて動く
        -->
        <button type="button" popovertarget="menu">メニュー ▾</button>
        <div id="menu" class="menu-popup" popover>
            <ul>
                <li><a href="#">プロフィールを編集</a></li>
                <li><a href="#">設定</a></li>
                <li><a href="#">ログアウト</a></li>
            </ul>
        </div>

        <button type="button" popovertarget="help">？ ヘルプ</button>
        <div id="help" class="help-popup" popover>
            メモは自動で保存されます。カテゴリのボタンで絞り込めます。
        </div>
    </section>

    <section>
        <h2>2. JavaScriptで開く（自動で消える通知）</h2>
        <p>保存ボタンを押すと右下に通知が出て、3秒後に自動で消えます。通知が出ている間も、ページは操作できます。</p>
        <button type="button" id="save">保存する</button>

        <!-- popover="manual"：外側をクリックしても閉じない。開閉は JavaScript で行う -->
        <div id="toast" class="toast" popover="manual" role="status">保存しました</div>
    </section>

    <script src="script.js"></script>
</body>
</html>
