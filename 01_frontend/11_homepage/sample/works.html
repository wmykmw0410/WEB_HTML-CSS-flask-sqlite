<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>制作実績 | 山田 太郎</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="制作実績 | 山田 太郎">
    <meta property="og:description" content="山田太郎がこれまでに作った作品の一覧です。">
    <meta property="og:image" content="img/avatar.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ヘッダー（全ページ共通）：上に固定し、スクロールすると影が付く。下端に読んだ量のバー -->
    <header class="site-header" id="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-name">Taro Yamada</a>
            <!-- 表示設定のポップアップを開くボタン（popover） -->
            <button type="button" class="icon-button settings-button" popovertarget="settings" aria-label="表示設定" data-tip="表示設定">⚙</button>
            <!-- 狭い画面でメニューを開閉するボタン -->
            <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="メニュー">☰</button>
            <nav aria-label="メインメニュー">
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="about.html">プロフィール</a></li>
                    <li><a href="works.html" aria-current="page">制作実績</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
        <div class="progress" id="progress"></div>
    </header>

    <!-- 表示設定（ポップアップ）：選んだテーマは localStorage に保存する -->
    <div id="settings" class="settings-popup" popover>
        <p class="settings-title">表示設定</p>
        <label><input type="radio" name="theme" value="auto"> OSの設定に合わせる</label>
        <label><input type="radio" name="theme" value="light"> ライト</label>
        <label><input type="radio" name="theme" value="dark"> ダーク</label>
    </div>

    <main class="container">
        <h1>制作実績</h1>
        <p>これまでに作った作品です。カードを押すと、詳しい説明が表示されます。</p>

        <section aria-label="作品一覧">
            <div class="filters" id="filters">
                <button type="button" data-tag="all" class="active">すべて</button>
                <button type="button" data-tag="HTML/CSS">HTML/CSS</button>
                <button type="button" data-tag="JavaScript">JavaScript</button>
                <button type="button" data-tag="Python">Python</button>
            </div>
            <!-- カードは data/works.json を読み込んで JavaScript で作る -->
            <p class="status" id="works-status">読み込み中…</p>
            <ul class="works-grid" id="works-list"></ul>
        </section>
    </main>

    <!-- 作品の詳細（モーダルウィンドウ） -->
    <dialog class="work-dialog" id="work-dialog" aria-labelledby="dialog-title">
        <div class="dialog-body">
            <p class="work-date" id="dialog-date"></p>
            <h2 id="dialog-title"></h2>
            <ul class="tag-list" id="dialog-tags"></ul>
            <p id="dialog-detail"></p>
            <h3>工夫した点</h3>
            <ul id="dialog-points"></ul>
            <div class="dialog-actions">
                <button type="button" class="button" id="dialog-close">閉じる</button>
            </div>
        </div>
    </dialog>

    <!-- トップへ戻るボタン：300px スクロールしたら表示する -->
    <button type="button" class="to-top" id="to-top" aria-label="ページの先頭へ戻る" hidden>↑</button>

    <footer class="site-footer">
        <div class="container">
            <small>&copy; 2026 Taro Yamada</small>
        </div>
    </footer>

    <!-- common.js：全ページ共通の動き ／ ページごとのファイル：そのページだけの動き -->
    <script src="js/common.js"></script>
    <script src="js/works.js"></script>
</body>
</html>
