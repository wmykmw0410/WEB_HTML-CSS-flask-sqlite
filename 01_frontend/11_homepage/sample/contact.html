<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ | 山田 太郎</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <meta property="og:type" content="website">
    <meta property="og:title" content="お問い合わせ | 山田 太郎">
    <meta property="og:description" content="山田太郎へのお問い合わせフォームです。">
    <meta property="og:image" content="img/avatar.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ヘッダー（全ページ共通）：上に固定し、スクロールすると影が付く。下端に読んだ量のバー -->
    <header class="site-header" id="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-name">Taro Yamada</a>
            <!-- 表示設定のポップアップを開くボタン（popover） -->
            <button type="button" class="icon-button settings-button" popovertarget="settings" aria-label="表示設定" data-tip="表示設定">⚙</button>
            <!-- 狭い画面でメニューを開閉するボタン -->
            <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="メニュー">☰</button>
            <nav aria-label="メインメニュー">
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="about.html">プロフィール</a></li>
                    <li><a href="works.html">制作実績</a></li>
                    <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
        <div class="progress" id="progress"></div>
    </header>

    <!-- 表示設定（ポップアップ）：選んだテーマは localStorage に保存する -->
    <div id="settings" class="settings-popup" popover>
        <p class="settings-title">表示設定</p>
        <label><input type="radio" name="theme" value="auto"> OSの設定に合わせる</label>
        <label><input type="radio" name="theme" value="light"> ライト</label>
        <label><input type="radio" name="theme" value="dark"> ダーク</label>
    </div>

    <main class="container">
        <h1>お問い合わせ</h1>
        <p>お仕事のご相談や作品へのご感想は、こちらからお送りください。</p>

        <form class="contact-form fade-in" id="contact-form" action="#" method="post" novalidate>
            <div class="field">
                <label for="name">お名前（必須）</label>
                <input id="name" type="text" name="name" required maxlength="50" autocomplete="name">
                <p class="error" id="name-error"></p>
            </div>

            <div class="field">
                <label for="email">メールアドレス（必須）</label>
                <input id="email" type="email" name="email" required autocomplete="email">
                <p class="error" id="email-error"></p>
            </div>

            <div class="field">
                <label for="category">お問い合わせ種別</label>
                <select id="category" name="category">
                    <option value="work">お仕事のご相談</option>
                    <option value="feedback">作品へのご感想</option>
                    <option value="other">その他</option>
                </select>
            </div>

            <div class="field">
                <label for="message">メッセージ（必須・10文字以上）</label>
                <textarea id="message" name="message" rows="6" required minlength="10" maxlength="1000"></textarea>
                <p class="char-count"><span id="message-count">0</span> / 1000文字</p>
                <p class="error" id="message-error"></p>
            </div>

            <button type="submit" class="button">送信する</button>
        </form>
    </main>

    <!-- 送信後の通知（ポップアップ）：3秒で自動的に消える -->
    <div class="toast" id="toast" popover="manual" role="status"></div>

    <!-- トップへ戻るボタン：300px スクロールしたら表示する -->
    <button type="button" class="to-top" id="to-top" aria-label="ページの先頭へ戻る" hidden>↑</button>

    <footer class="site-footer">
        <div class="container">
            <small>&copy; 2026 Taro Yamada</small>
        </div>
    </footer>

    <!-- common.js：全ページ共通の動き ／ ページごとのファイル：そのページだけの動き -->
    <script src="js/common.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
