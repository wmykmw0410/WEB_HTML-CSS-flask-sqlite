<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>お問い合わせ | 山田 太郎</title>
    <!-- TODO（1節）：img/favicon.svg を作り、<link rel="icon" href="img/favicon.svg" type="image/svg+xml"> で読み込む -->
    <!-- TODO（1節）：OGP の meta（og:type・og:title・og:description・og:image）を書く -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-name">Taro Yamada</a>
            <!-- 08_js_render で追加：狭い画面でメニューを開閉するボタン -->
            <button type="button" class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="メニュー">☰</button>
            <nav aria-label="メインメニュー">
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="about.html">プロフィール</a></li>
                    <li><a href="works.html">制作実績</a></li>
                    <li><a href="contact.html" aria-current="page">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>お問い合わせ</h1>
        <p>お仕事のご相談や作品へのご感想は、こちらからお送りください。</p>

        <form class="contact-form" id="contact-form" action="#" method="post" novalidate>
            <div class="field">
                <label for="name">お名前（必須）</label>
                <input id="name" type="text" name="name" required maxlength="50" autocomplete="name">
                <p class="error" id="name-error"></p>
            </div>

            <div class="field">
                <label for="email">メールアドレス（必須）</label>
                <input id="email" type="email" name="email" required autocomplete="email">
                <p class="error" id="email-error"></p>
            </div>

            <div class="field">
                <label for="category">お問い合わせ種別</label>
                <select id="category" name="category">
                    <option value="work">お仕事のご相談</option>
                    <option value="feedback">作品へのご感想</option>
                    <option value="other">その他</option>
                </select>
            </div>

            <div class="field">
                <label for="message">メッセージ（必須・10文字以上）</label>
                <textarea id="message" name="message" rows="6" required minlength="10" maxlength="1000"></textarea>
                <p class="error" id="message-error"></p>
            </div>

            <button type="submit" class="button">送信する</button>
        </form>

        <!-- 08_js_render で追加：送信後のメッセージを表示する場所 -->
        <p class="success" id="contact-result" role="status"></p>
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>&copy; 2026 Taro Yamada</small>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
