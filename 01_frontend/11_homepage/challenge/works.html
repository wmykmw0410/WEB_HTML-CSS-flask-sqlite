<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>制作実績 | 山田 太郎</title>
    <!-- TODO（1節）：img/favicon.svg を作り、<link rel="icon" href="img/favicon.svg" type="image/svg+xml"> で読み込む -->
    <!-- TODO（1節）：OGP の meta（og:type・og:title・og:description・og:image）を書く -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="site-name">Taro Yamada</a>
            <!-- 08_js_render で追加：狭い画面でメニューを開閉するボタン -->
            <button type="button" class="nav-toggle" id="nav-toggle">☰</button>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">ホーム</a></li>
                    <li><a href="about.html">プロフィール</a></li>
                    <li><a href="works.html" class="current">制作実績</a></li>
                    <li><a href="contact.html">お問い合わせ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>制作実績</h1>
        <p>これまでに作った作品です。</p>

        <section>
            <!-- 08_js_render で追加：技術ごとの絞り込みボタン -->
            <div class="filters" id="filters">
                <button type="button" data-tag="all" class="active">すべて</button>
                <button type="button" data-tag="HTML/CSS">HTML/CSS</button>
                <button type="button" data-tag="JavaScript">JavaScript</button>
                <button type="button" data-tag="Python">Python</button>
            </div>

            <!-- 10_js_data で変更：カードは data/works.json を読み込んで JavaScript で作る -->
            <p class="status" id="works-status">読み込み中…</p>
            <ul class="works-grid" id="works-list"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <small>&copy; 2026 Taro Yamada</small>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
