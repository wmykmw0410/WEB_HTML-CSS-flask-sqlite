<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>1. フォームの送信</title>
    <style>
        body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        section { border: 1px solid #e1e5eb; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
        input[type="text"] { padding: 6px; }
        .output { background: #f4f6f9; padding: 8px; border-radius: 4px; min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>フォームの送信</h1>

    <section>
        <h2>1. JavaScriptなし：送信するとページが再読み込みされる</h2>
        <p>文字を入力して「送信」を押すと、入力が消え、アドレスバーのURLの末尾に <code>?title=...</code> が付きます。</p>
        <form action="" method="get">
            <input type="text" name="title">
            <button type="submit">送信</button>
        </form>
    </section>

    <section>
        <h2>2. preventDefault() で送信を止める</h2>
        <p>文字を入力して「送信」を押しても、ページは再読み込みされず、入力も消えません。</p>
        <form id="stop-form" action="" method="get">
            <input type="text" name="title" id="stop-title">
            <button type="submit">送信</button>
        </form>
        <p class="output" id="stop-output"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
