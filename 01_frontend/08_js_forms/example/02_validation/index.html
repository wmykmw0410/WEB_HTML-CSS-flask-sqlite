<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2. 入力チェック</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #262b33; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c8ced8; border-radius: 6px; font: inherit; }
        .error { color: #d14343; font-size: 0.85rem; margin: 4px 0 8px; min-height: 1.2em; }
        #result { background: #e9f7ee; padding: 8px; border-radius: 6px; }
        #result:empty { display: none; }
    </style>
</head>
<body>
    <h1>入力チェック</h1>

    <!-- novalidate：ブラウザの標準チェックを切って、JavaScriptだけでチェックする -->
    <form id="name-form" action="#" method="post" novalidate>
        <label for="name">ニックネーム</label>
        <input id="name" type="text" name="name">
        <p class="error" id="name-error"></p>
        <button type="submit">登録する</button>
    </form>
    <p id="result"></p>

    <script src="script.js"></script>
</body>
</html>
