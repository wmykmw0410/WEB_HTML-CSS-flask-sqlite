<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>解答2：会員登録フォーム（HTML）</title>
    <style>
        /* 最小限の見た目（CSSは03_css_basicsで学ぶ） */
        body { font-family: sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; }
        form div { margin-bottom: 16px; }
        form div > label { display: block; font-weight: bold; }
        form div > label > input:not([type="checkbox"]) { display: block; margin-top: 4px; font-weight: normal; }
        form div > p { margin: 4px 0 0; font-size: 0.8rem; color: #6b7280; }
    </style>
</head>
<body>
    <form action="#" method="post">
        <h1>ユーザー登録</h1>

        <div>
            <!-- label で入力欄を包むと、ラベルの文字をクリックしたときに入力欄が選ばれる（for と id は不要） -->
            <label>ユーザー名
                <input type="text" name="username" required maxlength="50" autocomplete="username">
            </label>
        </div>

        <div>
            <label>メールアドレス
                <!-- type="email"：形式チェック付き。スマホでは @ 入りのキーボードが出る -->
                <input type="email" name="email" required autocomplete="email">
            </label>
        </div>

        <div>
            <label>パスワード
                <!-- autocomplete="new-password"：ブラウザが「新しいパスワードの提案」を出してくれる -->
                <input type="password" name="password" required minlength="4" autocomplete="new-password">
            </label>
            <p>4文字以上で入力してください</p>
        </div>

        <div>
            <label>パスワード（確認）
                <input type="password" name="confirm" required minlength="4" autocomplete="new-password">
            </label>
        </div>

        <!-- ラジオボタンのまとまりは fieldset + legend で「何を選ぶのか」を伝える -->
        <fieldset>
            <legend>主な用途</legend>
            <label><input type="radio" name="purpose" value="work" checked> 仕事</label>
            <label><input type="radio" name="purpose" value="study"> 勉強</label>
            <label><input type="radio" name="purpose" value="private"> プライベート</label>
        </fieldset>

        <div>
            <!-- label で包む書き方なら、文字をクリックしてもチェックを切り替えられる -->
            <label><input type="checkbox" name="newsletter" value="yes"> お知らせメールを受け取る</label>
        </div>

        <button type="submit">登録</button>
    </form>
</body>
</html>
