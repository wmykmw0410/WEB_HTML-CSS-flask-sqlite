<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>フォーム</title>
    <style>
        /* フォームを読みやすくする最小限のCSS（CSSは03_css_basicsで学ぶ） */
        body {
            font-family: sans-serif;
            max-width: 560px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* ラジオボタン・チェックボックスのラベルは横並びのままにする */
        fieldset label {
            display: inline;
            font-weight: normal;
            margin-right: 12px;
        }

        .hint {
            font-size: 0.85em;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <h1>お問い合わせ</h1>

    <!--
        action：送信先のURL（省略すると今のページに送信される）
        method：送信方法。get はURLの後ろに ?name=値 として付く。post はリクエストの本文に入る
        この先の 02_backend/08_request / 02_backend/09_forms で、Flask側でこの値を受け取る
    -->
    <form action="#" method="post">

        <div class="field">
            <!-- label の for と input の id を一致させると、ラベルをクリックで入力欄にフォーカスが移る -->
            <label for="name">お名前（必須）</label>
            <!-- name属性：サーバーに送られるときの「項目名」。name が無い入力欄は送信されない -->
            <input id="name" type="text" name="name" required maxlength="50" autocomplete="name">
        </div>

        <div class="field">
            <label for="email">メールアドレス（必須）</label>
            <!-- type="email"：形式チェック付き。スマホでは@入りのキーボードが出る -->
            <input id="email" type="email" name="email" required placeholder="taro@example.com" autocomplete="email">
        </div>

        <div class="field">
            <label for="tel">電話番号（任意）</label>
            <!-- pattern：正規表現で形式を指定。title はエラー時のヒントとして表示される -->
            <!-- （発展・任意）aria-describedby="tel-hint"：下のヒント（id="tel-hint"）を、入力欄の説明として読み上げさせる -->
            <input id="tel" type="tel" name="tel" pattern="[0-9]{10,11}" title="ハイフンなしの10〜11桁の数字" aria-describedby="tel-hint">
            <p id="tel-hint" class="hint">ハイフンなしで入力してください（例：09012345678）</p>
        </div>

        <div class="field">
            <label for="category">お問い合わせ種別</label>
            <select id="category" name="category">
                <option value="general">一般</option>
                <option value="support" selected>サポート</option>
                <option value="other">その他</option>
            </select>
        </div>

        <!-- fieldset / legend：関連する入力欄をグループにまとめ、グループ名を付ける -->
        <fieldset>
            <legend>ご希望の連絡方法</legend>
            <!-- ラジオボタンは name を揃えると「どれか1つだけ」選べるグループになる -->
            <label><input type="radio" name="contact" value="email" checked> メール</label>
            <label><input type="radio" name="contact" value="tel"> 電話</label>
        </fieldset>

        <fieldset>
            <legend>興味のある機能（複数選択可）</legend>
            <!-- チェックボックスは複数選べる -->
            <label><input type="checkbox" name="interest" value="search"> 検索</label>
            <label><input type="checkbox" name="interest" value="tag"> タグ</label>
            <label><input type="checkbox" name="interest" value="share"> 共有</label>
        </fieldset>

        <div class="field">
            <label for="age">年齢（任意）</label>
            <!-- type="number"：min / max / step で範囲を指定できる -->
            <input id="age" type="number" name="age" min="0" max="120" step="1">
        </div>

        <div class="field">
            <label for="date">ご希望の回答日（任意）</label>
            <input id="date" type="date" name="date">
        </div>

        <div class="field">
            <label for="message">メッセージ（必須・10文字以上）</label>
            <textarea id="message" name="message" rows="5" required minlength="10" maxlength="500"></textarea>
        </div>

        <div class="field">
            <label><input type="checkbox" name="agree" required> 利用規約に同意する</label>
        </div>

        <!-- type="submit"：送信 / type="reset"：入力内容を初期状態に戻す / type="button"：何もしない（JavaScript用） -->
        <button type="submit">送信</button>
        <button type="reset">リセット</button>
    </form>
</body>
</html>
