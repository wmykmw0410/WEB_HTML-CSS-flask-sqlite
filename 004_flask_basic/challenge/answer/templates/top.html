<!doctype html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/static/style.css">

<body>
    <header>
        <nav>
            <strong>メモ帳</strong>
            <a href="/">メモ一覧</a>
        </nav>
    </header>

    <main>
        <h1>メモ一覧</h1>
        <div class="card-grid">
            <a class="card" href="/memos/1">
                <span class="tag">家事</span>
                <h3>買い物リスト</h3>
                <p>牛乳、卵、パン、洗剤を買う。特売は火曜日まで。</p>
            </a>
            <a class="card" href="/memos/2">
                <span class="tag">仕事</span>
                <h3>企画会議メモ</h3>
                <p>来週の企画会議の議題を整理する。新商品の販促案について。</p>
            </a>
            <a class="card" href="/memos/3">
                <span class="tag">趣味</span>
                <h3>読書メモ：銀河鉄道の夜</h3>
                <p>宮沢賢治の作品。銀河や星座の描写が美しい。</p>
            </a>
            <a class="card" href="/memos/4">
                <span class="tag">アイデア</span>
                <h3>アプリのアイデア</h3>
                <p>習慣トラッカーアプリを作る。毎日の記録をグラフで見せる。</p>
            </a>
            <a class="card" href="/memos/5">
                <span class="tag">プライベート</span>
                <h3>旅行の持ち物リスト</h3>
                <p>パスポート、充電器、常備薬を忘れずに。</p>

    <footer>
        &copy; メモ帳
