<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2. DOM操作の基本</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
        textarea { width: 100%; height: 100px; box-sizing: border-box; }
        #count { color: #6b7280; font-size: 0.9em; }
        #count.over { color: #d1495b; font-weight: bold; }
    </style>
</head>
<body>
    <h1>文字数カウンター</h1>

    <textarea id="body" maxlength="500" placeholder="ここに入力..."></textarea>
    <p><span id="count">0</span> / 500文字</p>

    <script src="02_dom_basics.js"></script>
</body>
</html>
