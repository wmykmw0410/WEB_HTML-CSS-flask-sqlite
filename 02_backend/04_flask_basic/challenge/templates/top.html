<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="登録されているメモの一覧です。カテゴリとキーワードで絞り込めます。">
    <title>メモ帳</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <!-- 保存した配色を、CSSが当たる前に反映する（01_frontend/10_js_data 4節の「応用」） -->
    <script>
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (error) {
            // localStorage が使えない環境では、OS の設定（prefers-color-scheme）に従う
        }
    </script>
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="メインメニュー">
            <a class="site-name" href="/">メモ帳</a>
            <div class="nav-tools">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="配色を切り替える">◐</button>
                <button type="button" class="hamburger" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav-links">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="/" aria-current="page">メモ一覧</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>メモ一覧</h1>

        <!-- カテゴリ・キーワードの絞り込みは、script.js がブラウザ側で行う（02_backend/02_memo_app_frontend の list.js と同じ動き） -->
        <div class="list-tools">
            <div class="filters" role="group" aria-label="カテゴリで絞り込む">
                <button type="button" data-category="all" aria-pressed="true">すべて</button>
                <button type="button" data-category="家事" aria-pressed="false">家事</button>
                <button type="button" data-category="仕事" aria-pressed="false">仕事</button>
                <button type="button" data-category="趣味" aria-pressed="false">趣味</button>
                <button type="button" data-category="アイデア" aria-pressed="false">アイデア</button>
                <button type="button" data-category="プライベート" aria-pressed="false">プライベート</button>
            </div>
            <input type="search" id="keyword" class="search" placeholder="タイトル・本文で検索" aria-label="タイトル・本文で検索">
            <p class="list-count" id="list-count" role="status"></p>
        </div>

        <!-- 1件のメモはそれ単体で完結する内容なので article（01_frontend/02_html_semantic_form 1節） -->
        <div class="card-grid" id="card-grid">
            <article class="card" data-category="家事">
                <a class="card-link" href="/memos/1">
                    <span class="tag">家事</span>
                    <h2 class="card-title">買い物リスト</h2>
                    <p class="card-body">牛乳、卵、パン、洗剤を買う。特売は火曜日まで。</p>
                </a>
            </article>
            <article class="card" data-category="仕事">
                <a class="card-link" href="/memos/2">
                    <span class="tag">仕事</span>
                    <h2 class="card-title">企画会議メモ</h2>
                    <p class="card-body">来週の企画会議の議題を整理する。新商品の販促案について。</p>
                </a>
            </article>
            <article class="card" data-category="趣味">
                <a class="card-link" href="/memos/3">
                    <span class="tag">趣味</span>
                    <h2 class="card-title">読書メモ：銀河鉄道の夜</h2>
                    <p class="card-body">宮沢賢治の作品。銀河や星座の描写が美しい。</p>
                </a>
            </article>
            <article class="card" data-category="アイデア">
                <a class="card-link" href="/memos/4">
                    <span class="tag">アイデア</span>
                    <h2 class="card-title">アプリのアイデア</h2>
                    <p class="card-body">習慣トラッカーアプリを作る。毎日の記録をグラフで見せる。</p>
                </a>
            </article>
            <article class="card" data-category="プライベート">
                <a class="card-link" href="/memos/5">
                    <span class="tag">プライベート</span>
                    <h2 class="card-title">旅行の持ち物リスト</h2>
                    <p class="card-body">パスポート、充電器、常備薬を忘れずに。</p>
                </a>
            </article>
        </div>

        <p class="empty" id="empty" hidden>該当するメモはありません</p>
    </main>

    <footer class="site-footer">
        <small>&copy; メモ帳</small>
    </footer>

    <!-- 自動で消える通知（01_frontend/09_js_ui 2節）。script.js の showToast() で使う -->
    <div id="toast" class="toast" popover="manual" role="status"></div>

    <!-- 確認ダイアログ（01_frontend/09_js_ui 3節）。script.js が data-confirm を持つフォームで使う -->
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-message">
        <div class="dialog-body">
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button type="button" class="button-secondary" id="confirm-cancel">キャンセル</button>
                <button type="button" class="button-danger" id="confirm-ok">削除する</button>
            </div>
        </div>
    </dialog>

    <!-- トップへ戻るボタン（01_frontend/09_js_ui 5節） -->
    <button type="button" class="to-top" id="to-top" aria-label="ページの先頭へ戻る" hidden>↑</button>

    <!-- 全ページ共通の JavaScript（完成済み。02_backend/100_memo_api の static/script.js と同じ） -->
    <script src="/static/script.js"></script>
</body>
</html>
