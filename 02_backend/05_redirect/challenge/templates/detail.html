<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="メモの詳細です。">
    <title>{{ title }} - メモ帳</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <!-- 保存した配色を、CSSが当たる前に反映する（01_frontend/10_js_data 4節の「応用」） -->
    <script>
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (error) {
            // localStorage が使えない環境では、OS の設定（prefers-color-scheme）に従う
        }
    </script>
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="site-name" href="/">メモ帳</a>
            <div class="nav-tools">
                <button type="button" class="theme-toggle" id="theme-toggle">◐</button>
                <button type="button" class="hamburger" id="nav-toggle">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="/">メモ一覧</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="detail">
            <span class="tag">{{ category }}</span>
            <h1>{{ title }}</h1>
            <p>{{ body }}</p>
            <a class="back-link" href="/">メモ一覧へ戻る</a>
        </article>
    </main>

    <footer class="site-footer">
        <small>&copy; メモ帳</small>
    </footer>

    <!-- 自動で消える通知（01_frontend/09_js_ui 2節）。script.js の showToast() で使う -->
    <div id="toast" class="toast" popover="manual" role="status"></div>

    <!-- 確認ダイアログ（01_frontend/09_js_ui 3節）。script.js が data-confirm を持つフォームで使う -->
    <dialog id="confirm-dialog" class="confirm-dialog">
        <div class="dialog-body">
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button type="button" class="button-secondary" id="confirm-cancel">キャンセル</button>
                <button type="button" class="button-danger" id="confirm-ok">削除する</button>
            </div>
        </div>
    </dialog>

    <!-- トップへ戻るボタン（01_frontend/09_js_ui 5節） -->
    <button type="button" class="to-top" id="to-top" hidden>↑</button>

    <!-- 全ページ共通の JavaScript（完成済み。02_backend/100_memo_api の static/script.js と同じ） -->
    <script src="/static/script.js"></script>
</body>
</html>
