<!doctype html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="メモを編集するページです。">
    <title>メモを編集 - メモ帳</title>
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <!-- 保存した配色を、CSSが当たる前に反映する（01_frontend/10_js_data 4節の「応用」） -->
    <script>
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (error) {
            // localStorage が使えない環境では、OS の設定（prefers-color-scheme）に従う
        }
    </script>
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="メインメニュー">
            <a class="site-name" href="index.html">メモ帳</a>
            <div class="nav-tools">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="配色を切り替える">◐</button>
                <button type="button" class="hamburger" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav-links">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">メモ一覧</a></li>
                <li><a href="new.html">メモを追加</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>メモを編集</h1>
        <p class="lead" id="form-status" role="status"></p>

        <!--
            novalidate：ブラウザ標準の吹き出しを止め、form.js でメッセージを出す
            required・maxlength：:user-invalid（style.css）で、操作した後に不正な値なら赤枠にする
        -->
        <form class="memo-form" id="memo-form" novalidate>
            <div class="field">
                <label for="title">タイトル</label>
                <input type="text" id="title" name="title" required maxlength="100" autocomplete="off">
                <p class="client-error" id="title-error"></p>
            </div>

            <div class="field">
                <label for="category">カテゴリ</label>
                <select id="category" name="category">
                    <option>家事</option>
                    <option>仕事</option>
                    <option>趣味</option>
                    <option>アイデア</option>
                    <option>プライベート</option>
                </select>
            </div>

            <div class="field">
                <label for="body">本文</label>
                <textarea id="body" name="body" rows="5" required maxlength="500"></textarea>
                <p class="char-count"><span id="body-count">0</span> / 500文字</p>
                <p class="client-error" id="body-error"></p>
            </div>

            <div class="field">
                <label for="due_date">期限（任意）</label>
                <input type="date" id="due_date" name="due_date">
            </div>


            <p class="form-actions">
                <button type="submit" class="button-primary">保存する</button>
                <a href="index.html" id="cancel-link">キャンセル</a>
            </p>
        </form>
    </main>

    <footer class="site-footer">
        <small>&copy; メモ帳</small>
    </footer>

    <!-- 自動で消える通知（01_frontend/09_js_ui 2節）。common.js の showToast() で使う -->
    <div id="toast" class="toast" popover="manual" role="status"></div>

    <!-- 確認ダイアログ（01_frontend/09_js_ui 3節）。common.js の openConfirm() で使う -->
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-message">
        <div class="dialog-body">
            <p id="confirm-message"></p>
            <div class="dialog-actions">
                <button type="button" class="button-secondary" id="confirm-cancel">キャンセル</button>
                <button type="button" class="button-danger" id="confirm-ok">OK</button>
            </div>
        </div>
    </dialog>

    <!-- トップへ戻るボタン（01_frontend/09_js_ui 5節） -->
    <button type="button" class="to-top" id="to-top" aria-label="ページの先頭へ戻る" hidden>↑</button>

    <!-- 役割ごとに分けたJavaScriptを、上から順に読み込む（storage.js・common.js の関数を後のファイルで使うため、順番が大事） -->
    <script src="js/storage.js"></script>
    <script src="js/common.js"></script>
    <script src="js/form.js"></script>
</body>
</html>
