<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>条件分岐</title>
</head>
<body>
    <h1>条件分岐</h1>
    {% if color == 'red' %}
        <p style="color:red;">Red</p>
    {% elif color == 'blue' %}
        <p style="color:blue;">Blue</p>
    {% elif color == 'yellow' %}
        <p style="color:yellow;">Yellow</p>
    {% else %}
        <p>その他の色</p>
    {% endif %}
</body>
</html>
