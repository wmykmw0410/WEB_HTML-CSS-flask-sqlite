<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>forループ</title>
</head>
<body>
    <h1>商品一覧</h1>
    <table border="1">
        <thead>
            <tr><th>ID</th><th>名前</th></tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
